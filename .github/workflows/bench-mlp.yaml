name: MLP Benchmark

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'benches/mlp_bench.rs'

permissions:
  contents: read

jobs:
  benchmark:
    name: MLP Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run MLP benchmark
        run: cargo bench --bench mlp_bench

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-mlp
          path: target/criterion/
          retention-days: 30
