name: MLP Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'benches/mlp_bench.rs'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run MLP benchmark
        run: cargo bench --bench mlp_bench
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-mlp
          path: target/criterion/
          retention-days: 30
