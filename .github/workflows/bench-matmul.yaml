name: Matrix Multiplication Benchmark

on:
  push:
    branches:
      - master
    paths:
      - 'src/matrix/view.rs'
      - 'src/matrix/matmul.rs'
      - 'benches/matmul_bench.rs'

permissions:
  contents: read

jobs:
  benchmark:
    name: MatMul Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run MatMul benchmark
        run: cargo bench --bench matmul_bench

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-matmul
          path: target/criterion/
          retention-days: 30
